name: Android checks
on:
  push:
    branches: [main, developer]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        full: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, lint and build
        run: bash gradlew testDebugUnitTest lintRelease assembleRelease -PfullEdition=${{ matrix.full }} --console=plain
